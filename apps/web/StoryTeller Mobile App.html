<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StoryTeller — Mobile App Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/android-frame.jsx"></script>
<script type="text/babel" src="components/design-canvas.jsx"></script>
<script type="text/babel">

// Mobile design palette — matches OurStory webapp
const ACCENT = 'oklch(52% 0.14 35)';
const ACCENT_SOFT = 'oklch(92% 0.04 35)';
const PAPER = '#f4ede0';
const PAPER_ELEV = '#fbf6ec';
const PAPER_SUNK = '#eadfc9';
const INK = '#1f1a14';
const INK_SOFT = '#4a4236';
const INK_MUTE = '#8a7f6d';
const RULE = '#d9ccb1';
const SERIF = "'Fraunces', Georgia, serif";
const SANS = "'Inter', system-ui, sans-serif";
const MONO = "'JetBrains Mono', monospace";

// ──────────── Screen components ────────────

function MobileHome() {
  return (
    <div style={{ background: PAPER, minHeight: '100%', paddingBottom: 80 }}>
      {/* header */}
      <div style={{ padding: '12px 20px 8px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: ACCENT, display: 'inline-block' }}></span>
            <span style={{ fontFamily: SERIF, fontSize: 22, fontWeight: 500, color: INK, letterSpacing: '-0.01em' }}>StoryTeller</span>
          </div>
          <div style={{ width: 32, height: 32, borderRadius: '50%', background: `linear-gradient(135deg, ${ACCENT}, ${INK_SOFT})`, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: SERIF, fontSize: 14, fontWeight: 500 }}>M</div>
        </div>
        {/* search */}
        <div style={{ background: PAPER_ELEV, border: `1px solid ${RULE}`, borderRadius: 999, padding: '9px 14px', display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: INK_MUTE }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          Search stories, tags…
        </div>
      </div>

      {/* hero editor's pick */}
      <div style={{ padding: '12px 20px 0' }}>
        <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '0.15em', textTransform: 'uppercase', color: INK_MUTE, display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: ACCENT, display: 'inline-block' }}></span>
          Editor's Pick
        </div>
        <div style={{ background: PAPER_ELEV, border: `1px solid ${RULE}`, borderRadius: 12, padding: 18, boxShadow: '0 12px 24px -16px rgba(31,26,20,0.2)' }}>
          <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.15em', textTransform: 'uppercase', color: ACCENT, background: ACCENT_SOFT, padding: '3px 7px', borderRadius: 4 }}>Literary · Flash</span>
          <h3 style={{ fontFamily: SERIF, fontSize: 22, lineHeight: 1.1, margin: '10px 0 6px', fontWeight: 500, letterSpacing: '-0.01em', color: INK }}>My First Home</h3>
          <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 12, lineHeight: 1.5, color: INK_SOFT, borderLeft: `2px solid ${ACCENT}`, paddingLeft: 10, margin: '0 0 12px' }}>"A heartbeat, a warm place, a voice singing lullabies — the first morning of a life."</p>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 11, color: INK_MUTE, paddingTop: 10, borderTop: `1px dotted ${RULE}` }}>
            <span>By <b style={{ color: INK, fontWeight: 500 }}>Mara Solís</b></span>
            <span>4 min · 12.8k reads</span>
          </div>
        </div>
      </div>

      {/* Banner ad */}
      <div style={{ margin: '16px 20px', height: 60, background: `repeating-linear-gradient(135deg, ${PAPER_SUNK} 0 8px, transparent 8px 16px)`, border: `1px dashed ${RULE}`, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: MONO, fontSize: 9, letterSpacing: '0.1em', color: INK_MUTE, textTransform: 'uppercase', position: 'relative' }}>
        <span style={{ position: 'absolute', top: 4, left: 8, fontSize: 8 }}>AD</span>
        AdMob · 320 × 50 Banner
      </div>

      {/* genre chips */}
      <div style={{ padding: '0 20px 12px', display: 'flex', gap: 6, overflowX: 'auto' }}>
        {[
          ['All', true, INK],
          ['Literary', false, 'oklch(52% 0.14 35)'],
          ['Fantasy', false, 'oklch(52% 0.14 280)'],
          ['Sci-Fi', false, 'oklch(52% 0.14 200)'],
          ['Horror', false, 'oklch(42% 0.10 20)'],
          ['Mystery', false, 'oklch(45% 0.08 250)'],
        ].map(([label, active, color]) => (
          <div key={label} style={{
            padding: '6px 12px', borderRadius: 999, fontSize: 12, whiteSpace: 'nowrap',
            background: active ? INK : PAPER_ELEV,
            color: active ? PAPER : color,
            border: `1px solid ${active ? INK : RULE}`,
          }}>
            {!active && <span style={{ display: 'inline-block', width: 5, height: 5, borderRadius: '50%', background: color, marginRight: 5 }}></span>}
            {label}
          </div>
        ))}
      </div>

      {/* story list */}
      <div style={{ padding: '0 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {[
          { title: 'The Cartographer of Forgotten Rooms', author: 'Elena Voss', genre: 'Literary', color: 'oklch(52% 0.14 35)', excerpt: "Ines draws maps of places that don't exist anymore. One evening, a stranger asks her to find a room she has never seen.", minutes: 12, views: '8.4k' },
          { title: 'A Lantern in the Fog', author: 'Rowan Park', genre: 'Horror', color: 'oklch(42% 0.10 20)', excerpt: "In the marsh towns, they say if your light goes out, you're already gone.", minutes: 9, views: '6.2k' },
          { title: 'Signal From Io', author: 'Dara Chen', genre: 'Sci-Fi', color: 'oklch(52% 0.14 200)', excerpt: "The station hadn't transmitted in eleven years. Then, at 03:14 UTC, it said my name.", minutes: 38, views: '15.2k' },
        ].map((s, i) => (
          <div key={i} style={{ background: PAPER_ELEV, border: `1px solid ${RULE}`, borderRadius: 10, padding: 14, position: 'relative' }}>
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: s.color, borderRadius: '10px 10px 0 0' }}></div>
            <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', color: s.color, marginBottom: 6, display: 'flex', alignItems: 'center', gap: 5 }}>
              <span style={{ width: 5, height: 5, borderRadius: '50%', background: s.color, display: 'inline-block' }}></span>
              {s.genre} · {s.minutes} min
            </div>
            <h4 style={{ fontFamily: SERIF, fontSize: 17, margin: '0 0 4px', fontWeight: 500, lineHeight: 1.2, color: INK }}>{s.title}</h4>
            <p style={{ fontSize: 12, color: INK_SOFT, margin: '0 0 10px', lineHeight: 1.5 }}>{s.excerpt}</p>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: INK_MUTE, fontFamily: MONO, letterSpacing: '0.02em' }}>
              <span>{s.author}</span>
              <span>♥ · {s.views} reads</span>
            </div>
          </div>
        ))}
      </div>

      {/* bottom tab bar */}
      <div style={{ position: 'absolute', bottom: 28, left: 0, right: 0, height: 64, background: PAPER_ELEV, borderTop: `1px solid ${RULE}`, display: 'flex', justifyContent: 'space-around', alignItems: 'center', paddingTop: 6 }}>
        {[
          ['Home', true, <path key="h" d="M3 12l9-9 9 9v9a2 2 0 01-2 2h-5v-7H10v7H5a2 2 0 01-2-2z"/>],
          ['Library', false, <path key="l" d="M4 4v16M8 4v16M12 4v16M16 4v16M20 4v16"/>],
          ['Write', false, <><circle key="c" cx="12" cy="12" r="10"/><path key="p" d="M12 8v8M8 12h8"/></>],
          ['Saved', false, <path key="s" d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>],
          ['Me', false, <><circle key="c" cx="12" cy="8" r="4"/><path key="p" d="M4 21a8 8 0 0116 0"/></>],
        ].map(([label, active, icon]) => (
          <div key={label} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill={active ? ACCENT : 'none'} stroke={active ? ACCENT : INK_MUTE} strokeWidth="1.8">{icon}</svg>
            <span style={{ fontSize: 10, color: active ? ACCENT : INK_MUTE, fontWeight: active ? 600 : 400 }}>{label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function MobileReader() {
  return (
    <div style={{ background: PAPER, minHeight: '100%', position: 'relative' }}>
      {/* ribbon */}
      <div style={{ position: 'absolute', top: 0, left: 0, height: 2, background: ACCENT, width: '42%' }}></div>
      {/* header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 16px', borderBottom: `1px solid ${RULE}` }}>
        <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '0.1em', color: INK_MUTE, textTransform: 'uppercase', display: 'flex', alignItems: 'center', gap: 6 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back
        </div>
        <div style={{ display: 'flex', gap: 12, color: INK_SOFT }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill={ACCENT} stroke={ACCENT} strokeWidth="1.8"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 000-7.8z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </div>
      </div>

      <div style={{ padding: '20px 22px 120px' }}>
        <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '0.15em', textTransform: 'uppercase', color: ACCENT, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: ACCENT, display: 'inline-block' }}></span>
          Literary · 4 min read
        </div>
        <h1 style={{ fontFamily: SERIF, fontSize: 36, lineHeight: 1.05, letterSpacing: '-0.02em', margin: '0 0 16px', fontWeight: 400, color: INK }}>My First Home</h1>
        <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 14, lineHeight: 1.5, color: INK_SOFT, borderLeft: `2px solid ${ACCENT}`, paddingLeft: 12, margin: '0 0 20px' }}>A heartbeat, a warm place, a voice singing lullabies — and the first morning of a life.</p>
        {/* author */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingTop: 14, paddingBottom: 14, borderTop: `1px solid ${RULE}`, borderBottom: `1px solid ${RULE}`, marginBottom: 22 }}>
          <div style={{ width: 36, height: 36, borderRadius: '50%', background: `linear-gradient(135deg, ${ACCENT}, ${INK_SOFT})`, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: SERIF, fontSize: 15, fontWeight: 500 }}>M</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 500, color: INK }}>Mara Solís</div>
            <div style={{ fontSize: 10, color: INK_MUTE, fontFamily: MONO, letterSpacing: '0.04em' }}>Apr 12, 2026 · 12,847 reads</div>
          </div>
          <div style={{ padding: '5px 10px', borderRadius: 999, fontSize: 11, background: ACCENT, color: '#fff', fontWeight: 500 }}>Follow</div>
        </div>
        {/* body */}
        <div style={{ fontFamily: SERIF, fontSize: 16, lineHeight: 1.75, color: INK }}>
          <p style={{ fontFamily: MONO, fontSize: 13, color: ACCENT, letterSpacing: '0.2em', textAlign: 'center', margin: '0 0 14px' }}>Duh dum duh dum.</p>
          <p style={{ margin: '0 0 14px' }}>
            <span style={{ fontFamily: SERIF, fontSize: '3.8em', float: 'left', lineHeight: 0.82, padding: '0.05em 0.08em 0 0', color: ACCENT, fontWeight: 500 }}>O</span>ne ordinary day, I was playing with my friends when a blinding light came out of nowhere and consumed me.
          </p>
          <p style={{ fontFamily: MONO, fontSize: 13, color: ACCENT, letterSpacing: '0.2em', textAlign: 'center', margin: '16px 0' }}>Duh dum… duh dum…</p>
          <p style={{ margin: '0 0 14px' }}>I woke up, and it was so dark I felt scared — but there was a sound, so loud and steady, that I kept hearing it. Somehow, it gave me comfort.</p>
          {/* Inline portrait image — matches web image block system */}
          <figure style={{ margin: '18px 0', borderRadius: 8, overflow: 'hidden', border: `1px solid ${RULE}`, background: PAPER_ELEV }}>
            <div style={{ aspectRatio: '4/5', background: `linear-gradient(135deg, ${ACCENT_SOFT}, ${PAPER_SUNK})`, position: 'relative' }}>
              <svg viewBox="0 0 400 500" style={{ width: '100%', height: '100%', display: 'block' }}>
                <defs><radialGradient id="mw" cx="50%" cy="35%" r="40%"><stop offset="0%" stopColor="#fff" stopOpacity="0.5"/><stop offset="100%" stopColor="#fff" stopOpacity="0"/></radialGradient></defs>
                <rect width="400" height="500" fill="oklch(92% 0.04 35)"/>
                <circle cx="200" cy="170" r="70" fill="oklch(65% 0.11 35)"/>
                <path d="M110 500 Q110 320 200 320 Q290 320 290 500 Z" fill="oklch(52% 0.14 35)"/>
                <circle cx="200" cy="180" r="100" fill="url(#mw)"/>
              </svg>
            </div>
            <div style={{ padding: '10px 14px' }}>
              <div style={{ fontFamily: SERIF, fontSize: 14, fontWeight: 500, color: INK }}>Mother</div>
              <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.12em', color: INK_MUTE, textTransform: 'uppercase', marginTop: 2 }}>The Voice</div>
              <div style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 12, color: INK_SOFT, marginTop: 6 }}>I knew her before I saw her.</div>
            </div>
          </figure>
        </div>
        {/* mid-story ad */}
        <div style={{ marginTop: 24, height: 180, background: `repeating-linear-gradient(135deg, ${PAPER_SUNK} 0 8px, transparent 8px 16px)`, border: `1px dashed ${RULE}`, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: MONO, fontSize: 10, letterSpacing: '0.1em', color: INK_MUTE, textTransform: 'uppercase', position: 'relative' }}>
          <span style={{ position: 'absolute', top: 6, left: 8, fontSize: 8 }}>AD</span>
          AdMob Native · 300 × 250
        </div>
      </div>
    </div>
  );
}

function MobileCompose() {
  return (
    <div style={{ background: PAPER, minHeight: '100%' }}>
      {/* header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 16px', borderBottom: `1px solid ${RULE}`, background: PAPER_ELEV }}>
        <span style={{ fontSize: 13, color: INK_MUTE }}>Cancel</span>
        <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.12em', color: ACCENT, background: ACCENT_SOFT, padding: '3px 8px', borderRadius: 999, textTransform: 'uppercase' }}>✓ Saved</span>
        <span style={{ fontSize: 13, color: ACCENT, fontWeight: 600 }}>Publish</span>
      </div>
      <div style={{ padding: '22px 22px 100px' }}>
        <input placeholder="Title…" readOnly defaultValue="The Night Train" style={{ fontFamily: SERIF, fontSize: 30, lineHeight: 1.1, letterSpacing: '-0.02em', border: 0, width: '100%', background: 'transparent', padding: 0, margin: '0 0 12px', color: INK, fontWeight: 400, outline: 0 }} />
        <div style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 14, color: INK_SOFT, borderLeft: `2px solid ${ACCENT}`, paddingLeft: 10, marginBottom: 20, lineHeight: 1.5 }}>A conductor who remembers every passenger, and the one who never arrived.</div>

        <div style={{ fontFamily: SERIF, fontSize: 16, lineHeight: 1.7, color: INK }}>
          <p style={{ margin: '0 0 14px' }}>The 11:47 to Harlech has been my route for eleven years. In that time I have punched exactly forty-one thousand two hundred and sixteen tickets — I count them, every one —</p>
          <p style={{ margin: '0 0 14px', color: INK_MUTE }}><span style={{ borderBottom: `1.5px solid ${ACCENT}`, paddingBottom: 2 }}>and only one passenger has never reached the end of the line.</span></p>
        </div>

        {/* chips */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 22, paddingTop: 16, borderTop: `1px dotted ${RULE}` }}>
          <span style={{ fontSize: 10, padding: '4px 8px', borderRadius: 4, background: ACCENT_SOFT, color: ACCENT, fontFamily: MONO, letterSpacing: '0.02em' }}>#trains</span>
          <span style={{ fontSize: 10, padding: '4px 8px', borderRadius: 4, background: ACCENT_SOFT, color: ACCENT, fontFamily: MONO, letterSpacing: '0.02em' }}>#memory</span>
          <span style={{ fontSize: 10, padding: '4px 8px', borderRadius: 4, background: PAPER_SUNK, color: INK_MUTE, fontFamily: MONO, letterSpacing: '0.02em', border: `1px dashed ${RULE}` }}>+ add tag</span>
        </div>

        <div style={{ marginTop: 18, padding: 12, background: PAPER_ELEV, border: `1px solid ${RULE}`, borderRadius: 8, display: 'flex', justifyContent: 'space-between', fontSize: 11, fontFamily: MONO, color: INK_MUTE, letterSpacing: '0.02em' }}>
          <span>Genre · <b style={{ color: INK, fontWeight: 500 }}>Literary</b></span>
          <span>Length · <b style={{ color: INK, fontWeight: 500 }}>Flash</b></span>
          <span>142 words</span>
        </div>
      </div>
      {/* formatting toolbar */}
      <div style={{ position: 'absolute', bottom: 60, left: 0, right: 0, background: PAPER_ELEV, borderTop: `1px solid ${RULE}`, display: 'flex', padding: '8px 16px', gap: 14, justifyContent: 'space-around' }}>
        {['B','I','U','"','H','⋯'].map(l => (
          <div key={l} style={{ width: 34, height: 34, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, color: INK_SOFT, fontWeight: l === 'B' ? 700 : 400, fontStyle: l === 'I' ? 'italic' : 'normal', textDecoration: l === 'U' ? 'underline' : 'none', fontFamily: l === 'H' ? SERIF : SANS }}>{l}</div>
        ))}
      </div>
    </div>
  );
}

function MobileProfile() {
  return (
    <div style={{ background: PAPER, minHeight: '100%' }}>
      <div style={{ padding: '24px 22px 20px', borderBottom: `1px solid ${RULE}`, position: 'relative' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
          <div style={{ width: 64, height: 64, borderRadius: '50%', background: `linear-gradient(135deg, ${ACCENT}, ${INK_SOFT})`, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: SERIF, fontSize: 26, fontWeight: 500 }}>M</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: SERIF, fontSize: 22, fontWeight: 500, color: INK, letterSpacing: '-0.01em' }}>Mara Solís</div>
            <div style={{ fontFamily: MONO, fontSize: 11, color: INK_MUTE, letterSpacing: '0.02em' }}>@mara · joined Apr 2026</div>
          </div>
        </div>
        <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: 13, color: INK_SOFT, margin: '0 0 14px', lineHeight: 1.5 }}>Writing flash fiction about the small, warm moments. Believer in quiet prose.</p>
        <div style={{ display: 'flex', gap: 20, paddingTop: 14, borderTop: `1px solid ${RULE}` }}>
          {[['12', 'stories'], ['1.2k', 'followers'], ['42k', 'reads']].map(([n, l]) => (
            <div key={l}>
              <div style={{ fontFamily: SERIF, fontSize: 20, fontWeight: 500, color: INK, letterSpacing: '-0.01em' }}>{n}</div>
              <div style={{ fontSize: 10, color: INK_MUTE, fontFamily: MONO, letterSpacing: '0.05em', textTransform: 'uppercase' }}>{l}</div>
            </div>
          ))}
        </div>
      </div>
      {/* tabs */}
      <div style={{ display: 'flex', padding: '0 22px', borderBottom: `1px solid ${RULE}` }}>
        {['Published', 'Drafts', 'Bookmarks'].map((t, i) => (
          <div key={t} style={{ padding: '14px 0', marginRight: 22, fontSize: 13, color: i === 0 ? INK : INK_MUTE, fontWeight: i === 0 ? 500 : 400, borderBottom: i === 0 ? `2px solid ${ACCENT}` : 'none' }}>{t}</div>
        ))}
      </div>
      <div style={{ padding: '16px 22px', display: 'flex', flexDirection: 'column', gap: 14 }}>
        {[
          { t: 'My First Home', d: 'Apr 12 · 12.8k reads', g: ACCENT },
          { t: 'The Letter I Burned', d: 'Mar 28 · 3.2k reads', g: 'oklch(52% 0.14 280)' },
          { t: 'Rain on the Old Roof', d: 'Mar 15 · 1.8k reads', g: ACCENT },
        ].map((s, i) => (
